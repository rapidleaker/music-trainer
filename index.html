<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#102a43">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/icon-180.png">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
  <title>Music Trainer Ver.2.0</title>
</head>
<body>
  <header class="app-header">
    <div class="brand"><span class="brand-icon">𝄞</span><span>Music Trainer</span></div>
    <span class="version">Ver.2.0</span>
  </header>

  <main id="app">
    <section id="home" class="screen">
      <h1>トレーニングを選択</h1>
      <div class="mode-grid">
        <button class="mode-card" id="noteMode">
          <span class="mode-symbol">♫</span>
          <strong>音名トレーニング</strong>
          <small>五線譜の音名を答えます</small>
        </button>
        <button class="mode-card" id="rhythmMode">
          <span class="mode-symbol">♩</span>
          <strong>リズムトレーニング</strong>
          <small>リズムを見分け、タップします</small>
        </button>
      </div>
    </section>

    <section id="noteSetup" class="screen hidden">
      <h1>音名トレーニング</h1>
      <div class="card">
        <label>音域
          <select id="noteRange">
            <option value="beginner">初級：中央ド〜シ</option>
            <option value="intermediate">中級：低いド〜高いミ</option>
            <option value="advanced">上級：低いラ〜高いソ</option>
            <option value="custom">カスタム</option>
          </select>
        </label>
        <div id="customRange" class="custom-range hidden">
          <label>最低音<select id="customMin"></select></label>
          <label>最高音<select id="customMax"></select></label>
        </div>
        <label>1問の制限時間
          <select id="noteTime">
            <option value="5">5秒</option>
            <option value="10" selected>10秒</option>
            <option value="15">15秒</option>
          </select>
        </label>
        <button class="primary" id="startNote">開始</button>
        <button class="secondary backHome">ホームへ戻る</button>
      </div>
    </section>

    <section id="noteGame" class="screen hidden">
      <div class="stats">
        <span>問題 <b id="noteQuestion">1/10</b></span>
        <span>コンボ <b id="noteCombo">0</b></span>
        <span>スコア <b id="noteScore">0</b></span>
        <span>残り <b id="noteRemain">10</b>秒</span>
      </div>
      <div class="card">
        <svg id="staff" viewBox="0 0 600 260" aria-label="五線譜"></svg>
        <div id="noteMessage" class="message"></div>
        <div id="noteChoices" class="choice-grid"></div>
        <button class="danger" id="giveUpNote">中断する</button>
      </div>
    </section>

    <section id="rhythmSetup" class="screen hidden">
      <h1>リズムトレーニング</h1>
      <div class="card">
        <label>拍子
          <select id="meter">
            <option value="2">2/4</option>
            <option value="3">3/4</option>
            <option value="4" selected>4/4</option>
          </select>
        </label>
        <label>難易度
          <select id="rhythmLevel">
            <option value="beginner">初級</option>
            <option value="intermediate">中級</option>
            <option value="advanced">上級</option>
          </select>
        </label>
        <button class="primary" id="startRhythm">開始</button>
        <button class="secondary backHome">ホームへ戻る</button>
      </div>
    </section>

    <section id="rhythmGame" class="screen hidden">
      <div class="stats">
        <span>問題 <b id="rhythmQuestion">1/10</b></span>
        <span>コンボ <b id="rhythmCombo">0</b></span>
        <span>スコア <b id="rhythmScore">0</b></span>
      </div>
      <div class="card">
        <svg id="rhythmStaff" viewBox="0 0 700 220"></svg>
        <div id="rhythmChoices" class="rhythm-choices"></div>
        <div id="rhythmMessage" class="message"></div>
        <hr>
        <h2>タップ練習</h2>
        <p class="notice">判定は端末の処理遅延を含む練習用の目安です。</p>
        <button class="primary" id="startTap">タップ練習開始</button>
        <div id="countdown" class="countdown"></div>
        <button id="tapButton" class="tap-button hidden">TAP</button>
        <div id="tapResult"></div>
        <button class="danger" id="giveUpRhythm">中断する</button>
      </div>
    </section>

    <section id="result" class="screen hidden">
      <div class="card result-card">
        <h1 id="resultTitle">結果</h1>
        <div id="resultText"></div>
        <button class="primary" id="restart">もう一度</button>
        <button class="secondary backHome">ホームへ戻る</button>
      </div>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
